  }

    display: block;
    padding: 7px 6px;
    margin-bottom: 5px;
    background: #222;
    color: #fff;
    text-decoration: none;
    border: 1px solid #555;
  }
  a:focus, input:focus {
    background: #ffeb3b;
    color: #000;
    border: 2px solid #ff6d00;
    font-weight: bold;
  }
